include:
  - local: .gitlab/ci/base.yml

# Variables visibles al lanzar un pipeline a mano (Run pipeline) o en un schedule.
# Se transmiten al pipeline hijo de regresión.
variables:
  REGRESSION_MODE:
    value: 'manual'
    options: ['manual', 'auto']
    description: 'Schedules y pipelines ad hoc: manual (botón regression) o auto (corre sola). En push y MR siempre es manual.'
  TEST_ENV:
    value: 'qa'
    options: ['qa', 'une-dev']
    description: 'qa = BERSA QA; une-dev = UNE DEV (contraseña y OTP fijos).'
  TEST_PATH:
    value: ''
    description: 'Opcional: rutas de tests separadas por espacio (por ejemplo tests/ui/authentication).'
  TEST_FILTER:
    value: ''
    description: 'Opcional: expresión para --grep.'

stages:
  - setup
  - quality
  - regression

quality:
  extends: .pnpm_setup
  stage: quality
  variables:
    KUBERNETES_CPU_REQUEST: '1'
    KUBERNETES_MEMORY_REQUEST: '2Gi'
  script:
    - pnpm run check

# =====================================================================
# Regresión: un solo disparo que crea el pipeline hijo con los 3 shards
# encadenados y el reporte unificado (.gitlab/ci/regression.yml).
# Manual con allow_failure: no bloquea el pipeline ni el MR. Una vez
# disparado, la cadena completa corre sin más intervención.
# =====================================================================
regression:
  stage: regression
  needs:
    - job: quality
      artifacts: false
  trigger:
    include: .gitlab/ci/regression.yml
    strategy: depend
    forward:
      pipeline_variables: true
  rules:
    # Push y MR: siempre manual, sin importar REGRESSION_MODE.
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    # Schedule o pipeline ad hoc con REGRESSION_MODE=auto: corre sola.
    - if: '$REGRESSION_MODE == "auto"'
      when: on_success
    - when: manual
      allow_failure: true
