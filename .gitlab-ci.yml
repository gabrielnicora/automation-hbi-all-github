image: mcr.microsoft.com/playwright:v1.60.0-noble

variables:
  PNPM_VERSION: '11.19.0'
  PW_WORKERS: '1'

stages:
  - quality
  - ui

.pnpm_setup:
  before_script:
    - npm install --global pnpm@${PNPM_VERSION}
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/

quality:
  extends: .pnpm_setup
  stage: quality
  script:
    - pnpm run check

ui:login:bersa:
  extends: .pnpm_setup
  stage: ui
  when: manual
  script:
    - pnpm run test:ui:login
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    reports:
      junit: test-results/junit-report.xml
