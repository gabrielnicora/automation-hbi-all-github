image: mcr.microsoft.com/playwright:v1.60.0-noble

# Variables visibles al lanzar un pipeline a mano (Run pipeline) o en un schedule.
variables:
  REGRESSION_MODE:
    value: 'manual'
    options: ['manual', 'auto']
    description: 'Schedules y pipelines ad hoc: manual (cada job a mano) o auto (todo encadenado). En push y MR siempre es manual.'
  TEST_ENV:
    value: 'qa'
    options: ['qa', 'une-dev']
    description: 'qa = BERSA QA; une-dev = UNE DEV (contraseña y OTP fijos).'
  TEST_PATH:
    value: ''
    description: 'Opcional: rutas de tests separadas por espacio (por ejemplo tests/ui/002-authentication).'
  TEST_FILTER:
    value: ''
    description: 'Opcional: expresión para --grep.'
  PNPM_VERSION: '11.19.0'
  PW_WORKERS: '1'
  # Recursos base moderados para 1 worker de Playwright
  KUBERNETES_CPU_REQUEST: '2'
  KUBERNETES_CPU_LIMIT: '3'
  KUBERNETES_MEMORY_REQUEST: '4Gi'
  KUBERNETES_MEMORY_LIMIT: '6Gi'
  # Almacenamiento efímero ajustado para reportes y depuración
  KUBERNETES_EPHEMERAL_STORAGE_REQUEST: '2Gi'
  KUBERNETES_EPHEMERAL_STORAGE_LIMIT: '4Gi'
  # Sólo une-dev: dominios internos que se agregan a /etc/hosts ("ip host" por línea).
  # Puede reemplazarse con una variable de CI del proyecto.
  UNE_HOST_ENTRIES: |
    10.134.68.217 onlinebanking.dev.bancoune.com
    10.134.68.217 apii.dev.bancoune.com
    10.134.68.217 apie.dev.bancoune.com
    10.134.68.217 bffe.dev.bancoune.com
    10.134.68.217 hbi.dev.bancoune.com
    10.134.68.217 hbe.dev.bancoune.com
    10.134.68.217 obe.dev.bancoune.com
    10.134.68.217 officebanking.dev.bancoune.com

stages:
  - setup
  - quality
  - regression
  - report

default:
  tags:
    - application

# =====================================================================
# Modo de ejecución, igual para todos los jobs:
# - push y MR: siempre manual; cada job se lanza a mano.
# - schedule o pipeline ad hoc: REGRESSION_MODE=manual (a mano) o auto
#   (install_deps -> quality -> shard_1 -> shard_2 -> shard_3 -> merge_reports).
# Los manuales llevan allow_failure para no bloquear el pipeline ni el MR.
# =====================================================================
.run_mode:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$REGRESSION_MODE == "auto"'
      when: on_success
    - when: manual
      allow_failure: true

# =====================================================================
# 1. Setup: instala dependencias una vez y las comparte como artifact
# =====================================================================
install_deps:
  extends: .run_mode
  stage: setup
  script:
    - npm install --global pnpm@${PNPM_VERSION}
    - pnpm install --frozen-lockfile --store-dir "$CI_PROJECT_DIR/.pnpm-store"
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  artifacts:
    # Debe cubrir la espera entre jobs manuales y la cadena completa de shards.
    expire_in: 1 day
    paths:
      - node_modules/

# Los jobs posteriores reutilizan node_modules/ de install_deps (no ejecutan pnpm install).
.pnpm_setup:
  extends: .run_mode
  before_script:
    - npm install --global pnpm@${PNPM_VERSION}

# =====================================================================
# 2. Quality
# =====================================================================
quality:
  extends: .pnpm_setup
  stage: quality
  needs:
    - job: install_deps
      artifacts: true
  variables:
    KUBERNETES_CPU_REQUEST: '1'
    KUBERNETES_MEMORY_REQUEST: '2Gi'
  script:
    - pnpm run check

# =====================================================================
# 3. Regresión en 3 shards encadenados: 1 -> 2 -> 3
# Corren de a uno porque los escenarios API y UI reutilizan identidades
# (SPEC.md, sección 9). allow_failure: un fallo de tests no corta la cadena
# y el reporte final incluye todos los shards ejecutados.
# =====================================================================
.shard:
  extends: .pnpm_setup
  stage: regression
  timeout: 6 hours
  allow_failure: true
  variables:
    # Debe coincidir con la cantidad de jobs shard_N definidos abajo.
    SHARD_TOTAL: '3'
  before_script:
    - npm install --global pnpm@${PNPM_VERSION}
    - |
      if [ "$TEST_ENV" = "une-dev" ]; then
        echo "Configurando /etc/hosts para UNE DEV..."
        echo "$UNE_HOST_ENTRIES" | while read -r ip host rest; do
          if [ -z "$host" ]; then continue; fi
          if grep -qE "[[:space:]]${host}([[:space:]]|\$)" /etc/hosts; then
            echo "SKIP (ya existe): $host"
          else
            printf '%s\t%s\n' "$ip" "$host" >> /etc/hosts
            echo "ADD: $ip -> $host"
          fi
          getent hosts "$host" > /dev/null || echo "WARNING: no resuelve $host"
        done
      fi
  script:
    - |
      echo "Playwright | ${TEST_ENV} | shard ${SHARD_INDEX}/${SHARD_TOTAL} | workers=${PW_WORKERS}"
      echo "TEST_PATH:   ${TEST_PATH:-<todos>}"
      echo "TEST_FILTER: ${TEST_FILTER:-<sin grep>}"

      set -- --shard="${SHARD_INDEX}/${SHARD_TOTAL}" --reporter=list,blob
      # TEST_PATH sin comillas para admitir varias rutas separadas por espacio.
      if [ -n "$TEST_PATH" ]; then set -- "$@" $TEST_PATH; fi
      if [ -n "$TEST_FILTER" ]; then set -- "$@" --grep "$TEST_FILTER"; fi

      pnpm exec playwright test "$@"
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - blob-report/

shard_1:
  extends: .shard
  needs:
    - job: install_deps
      artifacts: true
    - job: quality
      artifacts: false
  variables:
    SHARD_INDEX: '1'

shard_2:
  extends: .shard
  needs:
    - job: install_deps
      artifacts: true
    - job: shard_1
      artifacts: false
  variables:
    SHARD_INDEX: '2'

shard_3:
  extends: .shard
  needs:
    - job: install_deps
      artifacts: true
    - job: shard_2
      artifacts: false
  variables:
    SHARD_INDEX: '3'

# =====================================================================
# 4. Reporte unificado (HTML + JUnit) con los blobs de los shards ejecutados
# En modo manual alcanza con haber corrido al menos un shard.
# =====================================================================
merge_reports:
  extends: .pnpm_setup
  stage: report
  needs:
    - job: install_deps
      artifacts: true
    - job: shard_1
      artifacts: true
    - job: shard_2
      artifacts: true
    - job: shard_3
      artifacts: true
  script:
    - |
      ls -la blob-report/ 2>/dev/null || true
      if ! ls blob-report/*.zip >/dev/null 2>&1; then
        echo "ERROR: no hay blobs en blob-report/. Ejecutar al menos un shard antes del merge."
        exit 1
      fi
      pnpm exec playwright merge-reports --config=merge.config.ts blob-report
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - playwright-report/
    reports:
      junit: test-results/junit-report.xml
