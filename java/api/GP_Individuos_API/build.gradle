plugins {
    id 'java'
    id 'io.qameta.allure' version '2.8.1'
}

group = 'org.GP_Individuos_API'
version = '1.0-SNAPSHOT'

repositories {
    jcenter()
    mavenCentral()
    maven {
        url "https://plugins.gradle.org/m2/"
    }
    flatDir {
        dirs 'dependencies'
    }
}

dependencies {
    implementation files('dependencies/oslo.2.5.2-SNAPSHOT.jar',
                         'dependencies/mysql-connector-java-8.0.29.jar'  )

    testImplementation(
            'org.junit.jupiter:junit-jupiter-api:5.10.2',
            'org.junit.jupiter:junit-jupiter-engine:5.10.2',
            'io.qameta.allure:allure-junit5:2.25.0',
            'mysql:mysql-connector-java:8.0.29',
            'org.assertj:assertj-core:3.24.2'
    )
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.1'
    testRuntimeOnly(
            'org.aspectj:aspectjweaver:1.9.22'
    )
}

allure {
    version = '2.13.0'
    aspectjweaver = true
    aspectjVersion ='1.9.22'
    configuration = 'testImplementation'
    useJUnit5 { version = allure.version }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
def environmentConfig = [
        SantaFe: [
                baseApiUrl: 'https://apitest01.bancosantafe.com',
                banco: 'SantaFe'
        ],
        EntreRios: [
                baseApiUrl: 'https://apitest01.bancoentrerios.com',
                banco:'EntreRios'
        ],
        SanJuan: [
                baseApiUrl: 'https://apitest01.bancosanjuan.com',
                banco:'SanJuan'
        ],
        SantaCruz : [
                baseApiUrl: 'https://apitest01.bancosantacruz.com',
                banco:'SantaCruz'
        ],
        BSFEMP: [
                baseApiUrl: 'https://beapitest01.bancosantafe.com',
                banco:'SantaFe'
        ],
        BERSAEMP: [
                baseApiUrl: 'https://beapitest01.bancoentrerios.com',
                banco:'EntreRios'
        ],
        BSJEMP: [
                baseApiUrl: 'https://beapitest01.bancosanjuan.com',
                banco:'SanJuan'
        ],
        BSCEMP: [
                baseApiUrl: 'https://beapitest01.bancosantacruz.com',
                banco:'SantaCruz'
        ]
]

def env = project.hasProperty('env') ? project.env : 'SantaFe'

def selectedEnvConfig = environmentConfig[env]

def apiUrl  = selectedEnvConfig.get('baseApiUrl')

def bank = selectedEnvConfig.get('banco')

def metodo = project.hasProperty("metodo") ? project.metodo : "comun"
def cuit = project.hasProperty("cuit") ? project.cuit : "sinDatos"
def dias = project.hasProperty("dias") ? project.dias : "sinDatos"
def echeq = project.hasProperty("echeq") ? project.echeq : "sinDatos"

test{
    System.setProperty("bankAPI", apiUrl)
    System.setProperty("metodo",metodo)
    System.setProperty("cuit", cuit)
    System.setProperty("dias", dias)
    System.setProperty("echeq", echeq)
     systemProperties = System.properties
}

test {
    filter {
        useJUnitPlatform()
        includeTestsMatching "*Test*"
    }
}

task JunitTest(type: Test) {
    systemProperties System.getProperties()
    def tag = systemProperties.get('tags').toString()
    systemProperty "junit.jupiter.extensions.autodetection.enabled", true // Permite que los Hooks se agrupen en el reporte (setUp y tearDown)
    useJUnitPlatform() {
        includeTags(tag)
        excludeTags("skip")
    }
}

task RegresionCompleta(type:Test) {
    useJUnitPlatform {
        systemProperties System.getProperties()
        systemProperty "junit.jupiter.extensions.autodetection.enabled", true
        filter {'*Test*'}
        }
    include '**/'+ bank +'/**/*Test.class'
    exclude '**/'+ bank +'/echeqADemanda/**'
    outputs.upToDateWhen { false }
}
task Criticos(type:Test) {
    useJUnitPlatform {
        systemProperties System.getProperties()
        systemProperty "junit.jupiter.extensions.autodetection.enabled", true
        includeTags "Criticos"
        filter {'*Test*'}
    }
    include '**/'+ bank +'/**/*Test.class'
    outputs.upToDateWhen { false }
}

task Echeq(type:Test) {
    useJUnitPlatform {
        systemProperties System.getProperties()
        systemProperty "junit.jupiter.extensions.autodetection.enabled", true
        filter {'*Test*'}
    }
    include '**/'+ bank +'/echeqADemanda/**'
    outputs.upToDateWhen { false }
}

task FullTestJunit4(type:Test) {
    systemProperties = System.properties
    include '**/**/TransferenciasTest.class'
    outputs.upToDateWhen {false}
}