
plugins {
    id 'java'
    id 'io.qameta.allure' version '2.8.1'
}

group 'global.practia.school'
version '1.0-SNAPSHOT'

sourceCompatibility = 1.8

repositories {
    jcenter()
    mavenCentral()
    maven{
        url "https://plugins.gradle.org/m2/"
    }
    flatDir {
        dirs 'dependencies'
    }
}

dependencies {
    testImplementation group: 'junit', name: 'junit', version: '4.13.1'
    implementation group: 'practia.global.jemeinsam-stark.madrid', name: 'web', version: '1.0-SNAPSHOT'
    testImplementation group: 'io.qameta.allure', name: 'allure-gradle', version: '2.8.1'
    testImplementation 'mysql:mysql-connector-java-8.0.29'
    implementation 'io.rest-assured:rest-assured:5.4.0'
    implementation 'io.rest-assured:json-schema-validator:5.4.0'
    testImplementation 'io.rest-assured:json-path:5.4.0'
}

allure {
    version = '2.13.0'
    autoconfigure = false
    aspectjweaver = true
    configuration = 'testImplementation'
    useJUnit5 {
        version = allure.version
    }
}


def environmentConfig = [
        SantaFe: [
                baseUrl: 'https://hbtest01.bancosantafe.com/startPage',
                baseApiUrl: 'https://apitest01.bancosantafe.com',
                banco: 'SantaFe'
        ],
        EntreRios: [
                baseUrl: 'https://hbtest01.bancoentrerios.com/startPage',
                baseApiUrl: 'https://apitest01.bancoentrerios.com',
                banco:'EntreRios'
        ],
        SanJuan: [
                baseUrl: 'https://hbtest01.bancosanjuan.com/startPage',
                baseApiUrl: 'https://apitest01.bancosanjuan.com',
                banco:'SanJuan'
        ],
        SantaCruz : [
                baseUrl: 'https://hbtest01.bancosantacruz.com/startPage',
                baseApiUrl: 'https://apitest01.bancosantacruz.com',
                banco:'SantaCruz'
        ]
]

def env = project.hasProperty('env') ? project.env : 'SantaFe'

def selectedEnvConfig = environmentConfig[env]

def mainUrl = selectedEnvConfig.get('baseUrl')
def apiUrl  = selectedEnvConfig.get('baseApiUrl')
def bank = selectedEnvConfig.get('banco')

def metodo = project.hasProperty("metodo") ? project.metodo : "comun"

test{
    System.setProperty("appUrl", mainUrl)
    System.setProperty("bankAPI", apiUrl)
    System.setProperty("metodo",metodo)
    systemProperties = System.properties
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

task GPSanity(type:Test){
    systemProperties = System.properties
    include '**/SanityTest/Sanity.class'
    outputs.upToDateWhen {false}
}
// Ejecuciones x TAGs
