task RollbackFront(type: Test) {
    systemProperties = System.properties
    include '**/'+ bank +'/**/FrontTest.class'
    outputs.upToDateWhen {false}

    // Métodos específicos dentro de FrontTest:
    filter {
        includeTestsMatching "*.${bank}.*.FrontTest.TC0044*"
        includeTestsMatching "*.${bank}.*.FrontTest.TC0045*"
        includeTestsMatching "*.${bank}.*.FrontTest.TC0046*"
        includeTestsMatching "*.${bank}.*.FrontTest.TC0047*"
        includeTestsMatching "*.${bank}.*.FrontTest.TC0104*"
        failOnNoMatchingTests = true
    }

}
