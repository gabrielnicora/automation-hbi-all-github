# Pipeline hijo de regresión, creado por el job `regression` de .gitlab-ci.yml.
# Recibe TEST_ENV, TEST_PATH y TEST_FILTER del pipeline principal.
#
# Los 3 shards corren encadenados (1 -> 2 -> 3), de a uno, porque los escenarios
# API y UI reutilizan identidades (SPEC.md, sección 9). Dividir la suite acota la
# duración de cada job y conserva evidencia parcial; no agrega paralelismo.
include:
  - local: .gitlab/ci/base.yml

variables:
  # Sólo une-dev: dominios internos que se agregan a /etc/hosts ("ip host" por línea).
  # Puede reemplazarse con una variable de CI del proyecto.
  UNE_HOST_ENTRIES: |
    10.134.68.217 onlinebanking.dev.bancoune.com
    10.134.68.217 apii.dev.bancoune.com
    10.134.68.217 apie.dev.bancoune.com
    10.134.68.217 bffe.dev.bancoune.com
    10.134.68.217 hbi.dev.bancoune.com
    10.134.68.217 hbe.dev.bancoune.com
    10.134.68.217 obe.dev.bancoune.com
    10.134.68.217 officebanking.dev.bancoune.com

stages:
  - setup
  - regression
  - report

.shard:
  extends: .pnpm_setup
  stage: regression
  timeout: 6 hours
  # Un fallo de tests no corta la cadena y el reporte final incluye los tres shards.
  allow_failure: true
  variables:
    # Debe coincidir con la cantidad de jobs shard_N definidos abajo.
    SHARD_TOTAL: '3'
  before_script:
    - npm install --global pnpm@${PNPM_VERSION}
    - |
      if [ "$TEST_ENV" = "une-dev" ]; then
        echo "Configurando /etc/hosts para UNE DEV..."
        echo "$UNE_HOST_ENTRIES" | while read -r ip host rest; do
          if [ -z "$host" ]; then continue; fi
          if grep -qE "[[:space:]]${host}([[:space:]]|\$)" /etc/hosts; then
            echo "SKIP (ya existe): $host"
          else
            printf '%s\t%s\n' "$ip" "$host" >> /etc/hosts
            echo "ADD: $ip -> $host"
          fi
          getent hosts "$host" > /dev/null || echo "WARNING: no resuelve $host"
        done
      fi
  script:
    - |
      echo "Playwright | ${TEST_ENV} | shard ${SHARD_INDEX}/${SHARD_TOTAL} | workers=${PW_WORKERS}"
      echo "TEST_PATH:   ${TEST_PATH:-<todos>}"
      echo "TEST_FILTER: ${TEST_FILTER:-<sin grep>}"

      set -- --shard="${SHARD_INDEX}/${SHARD_TOTAL}" --reporter=list,blob
      # TEST_PATH sin comillas para admitir varias rutas separadas por espacio.
      if [ -n "$TEST_PATH" ]; then set -- "$@" $TEST_PATH; fi
      if [ -n "$TEST_FILTER" ]; then set -- "$@" --grep "$TEST_FILTER"; fi

      pnpm exec playwright test "$@"
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - blob-report/

shard_1:
  extends: .shard
  variables:
    SHARD_INDEX: '1'

shard_2:
  extends: .shard
  needs:
    - job: install_deps
      artifacts: true
    - job: shard_1
      artifacts: false
  variables:
    SHARD_INDEX: '2'

shard_3:
  extends: .shard
  needs:
    - job: install_deps
      artifacts: true
    - job: shard_2
      artifacts: false
  variables:
    SHARD_INDEX: '3'

# Reporte unificado (HTML + JUnit) a partir de los blobs de los shards.
merge_reports:
  extends: .pnpm_setup
  stage: report
  when: always
  needs:
    - job: install_deps
      artifacts: true
    - job: shard_1
      artifacts: true
    - job: shard_2
      artifacts: true
    - job: shard_3
      artifacts: true
  script:
    - |
      ls -la blob-report/ 2>/dev/null || true
      if ! ls blob-report/*.zip >/dev/null 2>&1; then
        echo "ERROR: no hay blobs en blob-report/. ¿Corrieron los shards?"
        exit 1
      fi
      pnpm exec playwright merge-reports --config=merge.config.ts blob-report
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - playwright-report/
    reports:
      junit: test-results/junit-report.xml
