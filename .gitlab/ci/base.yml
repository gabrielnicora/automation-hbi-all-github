# Configuración compartida por el pipeline principal y el pipeline hijo de regresión.
image: mcr.microsoft.com/playwright:v1.60.0-noble

variables:
  PNPM_VERSION: '11.19.0'
  PW_WORKERS: '1'
  # Recursos base moderados para 1 worker de Playwright
  KUBERNETES_CPU_REQUEST: '2'
  KUBERNETES_CPU_LIMIT: '3'
  KUBERNETES_MEMORY_REQUEST: '4Gi'
  KUBERNETES_MEMORY_LIMIT: '6Gi'
  # Almacenamiento efímero ajustado para reportes y depuración
  KUBERNETES_EPHEMERAL_STORAGE_REQUEST: '2Gi'
  KUBERNETES_EPHEMERAL_STORAGE_LIMIT: '4Gi'

default:
  tags:
    - application

# Instala dependencias una vez por pipeline y las comparte como artifact.
install_deps:
  stage: setup
  script:
    - npm install --global pnpm@${PNPM_VERSION}
    - pnpm install --frozen-lockfile --store-dir "$CI_PROJECT_DIR/.pnpm-store"
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  artifacts:
    # Debe cubrir la cadena completa de shards (hasta 6 horas cada uno).
    expire_in: 1 day
    paths:
      - node_modules/

# Los jobs posteriores reutilizan node_modules/ de install_deps (no ejecutan pnpm install).
.pnpm_setup:
  needs:
    - job: install_deps
      artifacts: true
  before_script:
    - npm install --global pnpm@${PNPM_VERSION}
